<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Change these variables to control the colors */
    :root {
      --outline-color: black;
      --background-color: #f0f0f0;
    }
    .outline {
      fill: none;
      stroke: var(--outline-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .background {
      fill: var(--background-color);
    }
  </style>
  
  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" class="background" />
  
  <!-- Collaboration Board / Screen -->
  <rect x="130" y="80" width="140" height="100" class="outline" />
  <!-- You can add a horizontal line to indicate a division on the board if desired -->
  <line x1="130" y1="130" x2="270" y2="130" class="outline" />

  <!-- Person on the Left -->
  <g id="person-left">
    <!-- Head -->
    <circle cx="80" cy="150" r="15" class="outline" />
    <!-- Body -->
    <line x1="80" y1="165" x2="80" y2="210" class="outline" />
    <!-- Arms -->
    <line x1="80" y1="175" x2="50" y2="190" class="outline" />
    <line x1="80" y1="175" x2="110" y2="190" class="outline" />
    <!-- Legs -->
    <line x1="80" y1="210" x2="60" y2="240" class="outline" />
    <line x1="80" y1="210" x2="100" y2="240" class="outline" />
  </g>
  
  <!-- Person on the Right -->
  <g id="person-right">
    <!-- Head -->
    <circle cx="320" cy="150" r="15" class="outline" />
    <!-- Body -->
    <line x1="320" y1="165" x2="320" y2="210" class="outline" />
    <!-- Arms -->
    <line x1="320" y1="175" x2="300" y2="190" class="outline" />
    <line x1="320" y1="175" x2="340" y2="190" class="outline" />
    <!-- Legs -->
    <line x1="320" y1="210" x2="300" y2="240" class="outline" />
    <line x1="320" y1="210" x2="340" y2="240" class="outline" />
  </g>
  
  <!-- Person at the Bottom -->
  <g id="person-bottom">
    <!-- Head -->
    <circle cx="200" cy="260" r="15" class="outline" />
    <!-- Body -->
    <line x1="200" y1="275" x2="200" y2="310" class="outline" />
    <!-- Arms -->
    <line x1="200" y1="285" x2="180" y2="300" class="outline" />
    <line x1="200" y1="285" x2="220" y2="300" class="outline" />
    <!-- Legs -->
    <line x1="200" y1="310" x2="180" y2="340" class="outline" />
    <line x1="200" y1="310" x2="220" y2="340" class="outline" />
  </g>
  
</svg>
